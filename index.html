<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResourceRush Live Tracker</title>
    <style>
        body { background: #1e1e2e; color: #cdd6f4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 1300px; margin: 0 auto;}
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #45475a; padding-bottom: 10px;}
        .status { color: #a6e3a1; font-weight: bold; font-size: 0.9em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        
        /* Removed 'align-self: start' so all cards automatically stretch to the tallest column's bottom line */
        .card { background: #181825; padding: 15px; border-radius: 8px; border: 1px solid #313244; display: flex; flex-direction: column; }
        
        .title { color: #89b4fa; font-size: 1.2em; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #313244; padding-bottom: 5px; }
        
        /* Increased top margin to 40px to create significant space before secondary groups like Nether/Agriculture */
        .sub-title { color: #cba6f7; font-size: 1.1em; font-weight: bold; margin: 40px 0 10px 0; border-bottom: 1px dashed #45475a; padding-bottom: 5px; }
        
        .item { 
            display: grid; 
            grid-template-columns: 1fr 45px 85px; 
            gap: 10px; 
            align-items: center; 
            margin: 5px 0; 
            padding: 4px 0; 
            border-bottom: 1px dashed #313244;
        }
        
        .item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-count { color: #6c7086; font-size: 0.85em; text-align: right; }
        .item-yield { text-align: right; }
        
        .val-high { color: #a6e3a1; font-weight: bold; } 
        .val-med { color: #f9e2af; } 
        .val-low { color: #f38ba8; }
        .empty-state { text-align: center; color: #6c7086; margin-top: 50px; font-size: 1.1em; grid-column: 1 / -1; }
        .count-badge { color: #6c7086; font-size: 0.8em; font-weight: normal; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin: 0;">ResourceRush Live Tracker <span id="totalHeaderCount" style="color: #89b4fa; font-size: 0.7em; margin-left: 10px;"></span></h2>
        <div class="status" id="statusText">Waiting for Discord data...</div>
    </div>
    
    <div id="output" class="grid">
        <div class="empty-state">
            Keep the Discord channel open in another tab. The data will sync automatically!
        </div>
    </div>

    <script>
        const layout = [
            [
                { title: "Ores", items: ["Amethyst Shard", "Coal", "Copper Ingot", "Diamond", "Emerald", "Gold Ingot", "Iron Ingot", "Lapis Lazuli", "Redstone", "Raw Copper", "Raw Gold", "Raw Iron", "Resin Brick", "Prismarine Crystals"] },
                { title: "Nether", items: ["Netherite Ingot", "Quartz", "Glowstone Dust"] }
            ],
            [
                { title: "Veg Food", items: ["Apple", "Baked Potato", "Beetroot", "Beetroot Soup", "Bread", "Cake", "Carrot", "Chorus Fruit", "Cookie", "Dried Kelp", "Enchanted Golden Apple", "Glow Berries", "Golden Apple", "Golden Carrot", "Honey Bottle", "Melon Slice", "Mushroom Stew", "Poisonous Potato", "Potato", "Pumpkin Pie", "Suspicious Stew", "Sweet Berries"] }
            ],
            [
                { title: "Non-Veg Food", items: ["Beef", "Chicken", "Cod", "Cooked Chicken", "Cooked Cod", "Cooked Mutton", "Cooked Porkchop", "Cooked Rabbit", "Cooked Salmon", "Mutton", "Porkchop", "Pufferfish", "Rabbit", "Rabbit Stew", "Salmon", "Steak", "Tropical Fish"] },
                { title: "Agriculture", items: ["Bone Meal", "Pitcher Pod", "Seagrass", "Sugar", "Torchflower Seeds"] }
            ],
            [
                { title: "Hostile Drops", items: ["Arrow", "Blaze Rod", "Bone", "Breeze Rod", "Ender Pearl", "Ghast Tear", "Gunpowder", "Magma Cream", "Ominous Bottle", "Phantom Membrane", "Rotten Flesh", "Shulker Shell", "Slime Ball", "Spider Eye", "Wither Skeleton Skull", "Zombie Head"] }
            ],
            [
                { title: "Passive Drops", items: ["Armadillo Scute", "Egg", "Feather", "Glow Ink Sac", "Goat Horn", "Ink Sac", "Leather", "Rabbit Foot", "Rabbit Hide", "Turtle Scute", "Wool"] }
            ],
            [
                { title: "Misc", items: ["Glass Bottle", "Lead", "Milk Bucket", "Nautilus Shell", "Nether Star", "Prismarine Shard", "Saddle", "Sculk Catalyst", "Snowball", "Stick", "String", "Totem Of Undying", "Trident", "Wet Sponge"] }
            ]
        ];

        window.addEventListener('updateDashboard', (e) => {
            parseAndRender(e.detail);
            document.getElementById('statusText').innerText = `Last synced: ${new Date().toLocaleTimeString()}`;
        });

        function parseAndRender(rawText) {
            const lines = rawText.split('\n');
            const data = {};
            const trackedItems = new Set();
            
            lines.forEach(line => {
                if(!line.includes(':')) return;
                let [item, count] = line.split(':').map(s => s.trim());
                data[item] = parseInt(count) || 0;
            });

            // Update Total Header Count
            const totalItemsFound = Object.keys(data).length;
            document.getElementById('totalHeaderCount').innerText = `(${totalItemsFound} Total Items)`;

            let html = '';
            
            layout.forEach(cardGroup => {
                let catHtml = `<div class="card">`;
                
                cardGroup.forEach((section, index) => {
                    let sortedItems = [];
                    section.items.forEach(item => {
                        if (data[item] !== undefined) {
                            let count = data[item];
                            let yieldVal = count === 0 ? 1.00 : (1 / Math.sqrt(count)); 
                            sortedItems.push({ name: item, count, yield: yieldVal });
                            trackedItems.add(item);
                        }
                    });

                    sortedItems.sort((a, b) => b.yield - a.yield);

                    // Add the count badge dynamically to the title
                    if (index === 0) {
                        catHtml += `<div class="title">${section.title} <span class="count-badge">(${sortedItems.length})</span></div>`;
                    } else {
                        catHtml += `<div class="sub-title">${section.title} <span class="count-badge">(${sortedItems.length})</span></div>`;
                    }

                    if(sortedItems.length === 0) {
                        catHtml += `<div style="color: #6c7086; font-size: 0.9em; padding: 5px 0;">No items tracked yet.</div>`;
                    } else {
                        sortedItems.forEach(i => {
                            let colorClass = i.yield >= 0.5 ? 'val-high' : (i.yield >= 0.15 ? 'val-med' : 'val-low');
                            catHtml += `<div class="item">
                                <span class="item-name">${i.name}</span>
                                <span class="item-count">(${i.count})</span>
                                <span class="item-yield ${colorClass}">+${i.yield.toFixed(2)} pts</span>
                            </div>`;
                        });
                    }
                });
                
                catHtml += `</div>`;
                html += catHtml;
            });

            let othersItems = [];
            for (const [item, count] of Object.entries(data)) {
                if (!trackedItems.has(item)) {
                    let yieldVal = count === 0 ? 1.00 : (1 / Math.sqrt(count));
                    othersItems.push({ name: item, count, yield: yieldVal });
                }
            }

            if (othersItems.length > 0) {
                othersItems.sort((a, b) => b.yield - a.yield);
                let othersHtml = `<div class="card" style="border-color: #cba6f7;">
                    <div class="title" style="color: #cba6f7;">Others <span class="count-badge">(${othersItems.length})</span></div>`;
                othersItems.forEach(i => {
                    let colorClass = i.yield >= 0.5 ? 'val-high' : (i.yield >= 0.15 ? 'val-med' : 'val-low');
                    othersHtml += `<div class="item">
                        <span class="item-name">${i.name}</span>
                        <span class="item-count">(${i.count})</span>
                        <span class="item-yield ${colorClass}">+${i.yield.toFixed(2)} pts</span>
                    </div>`;
                });
                html += othersHtml + `</div>`;
            }

            document.getElementById('output').innerHTML = html;
        }
    </script>
</body>
</html>
