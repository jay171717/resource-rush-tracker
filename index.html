<script>
        let layout = [
            [ ["Copper Ingot", "Iron Ingot", "Gold Ingot", "Emerald", "Diamond", "Lapis Lazuli", "Coal", "Redstone"] ],
            [ ["Amethyst Shard", "Netherite Ingot", "Quartz", "Glowstone Dust"], ["Prismarine Crystals", "Prismarine Shard", "Nautilus Shell"] ],
            [ ["Rotten Flesh", "Bone", "Arrow", "Spider Eye", "Gunpowder", "Ender Pearl", "String", "Zombie Head"] ],
            [ ["Ghast Tear", "Magma Cream", "Blaze Rod", "Wither Skeleton Skull"], ["Slime Ball", "Phantom Membrane", "Shulker Shell"] ],
            [ ["Bread", "Apple", "Carrot", "Beetroot", "Potato", "Baked Potato", "Poisonous Potato", "Chorus Fruit"] ],
            [ ["Glow Berries", "Sweet Berries", "Melon Slice", "Dried Kelp"], ["Torchflower Seeds", "Seagrass", "Pitcher Pod"] ],
            [ ["Chicken", "Porkchop", "Beef", "Mutton", "Rabbit", "Salmon", "Cod", "Tropical Fish"] ],
            [ ["Cooked Chicken", "Cooked Porkchop", "Steak", "Cooked Mutton", "Cooked Rabbit", "Cooked Salmon", "Cooked Cod", "Pufferfish"] ],
            [ ["Mushroom Stew", "Beetroot Soup", "Rabbit Stew", "Suspicious Stew"], ["Cake", "Cookie", "Pumpkin Pie"] ],
            [ ["Honey Bottle", "Bone Meal", "Milk Bucket", "Sugar"], ["Golden Apple", "Enchanted Golden Apple", "Golden Carrot"] ],
            [ ["Egg", "Feather", "Leather", "Wool", "Armadillo Scute", "Turtle Scute"], ["Rabbit Foot", "Rabbit Hide", "Glow Ink Sac", "Ink Sac"] ],
            [ ["Snowball", "Lead", "Breeze Rod", "Ominous Bottle", "Resin Brick", "Nether Star", "Sculk Catalyst", "Totem Of Undying", "Trident", "Wet Sponge", "Saddle", "Stick", "Glass Bottle"] ]
        ];

        // Manual routing for items without standard 2D textures or mismatched internal names
        const iconOverrides = {
            "Steak": "https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/item/cooked_beef.png",
            "Enchanted Golden Apple": "https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/item/golden_apple.png",
            "Zombie Head": "https://mc-heads.net/avatar/MHF_Zombie/24",
            "Wither Skeleton Skull": "https://mc-heads.net/avatar/MHF_Wither/24"
        };

        window.addEventListener('updateDashboard', (e) => {
            parseAndRender(e.detail);
            document.getElementById('statusText').innerText = `Last synced: ${new Date().toLocaleTimeString()}`;
        });

        function parseAndRender(rawText) {
            const lines = rawText.split('\n');
            const data = {};
            const trackedItems = new Set();
            
            lines.forEach(line => {
                if(!line.includes(':')) return;
                let [item, count] = line.split(':').map(s => s.trim());
                data[item] = parseInt(count) || 0;
            });

            const totalItemsFound = Object.keys(data).length;
            document.getElementById('totalHeaderCount').innerText = `(${totalItemsFound} Total Items)`;

            layout.forEach(group => group.forEach(sub => sub.forEach(i => trackedItems.add(i))));
            let unknownItems = [];
            for (const item of Object.keys(data)) {
                if (!trackedItems.has(item)) {
                    unknownItems.push(item);
                    trackedItems.add(item);
                }
            }
            if (unknownItems.length > 0) {
                if (layout[11].length > 1 && layout[11][layout[11].length - 1].some(i => unknownItems.includes(i))) {
                    layout[11].pop(); 
                }
                layout[11].push(unknownItems);
            }

            let html = '';
            
            layout.forEach(group => {
                let catHtml = `<div class="card">`;
                
                group.forEach((subgroup, index) => {
                    let sortedItems = [];

                    subgroup.forEach(item => {
                        if (data[item] !== undefined) {
                            let count = data[item];
                            let yieldVal = count === 0 ? 1.00 : (1 / Math.sqrt(count)); 
                            sortedItems.push({ name: item, count, yield: yieldVal });
                        }
                    });

                    sortedItems.sort((a, b) => b.yield - a.yield);

                    sortedItems.forEach(i => {
                        let colorClass = i.yield >= 0.5 ? 'val-high' : (i.yield >= 0.15 ? 'val-med' : 'val-low');
                        
                        let formattedId = i.name.toLowerCase().replace(/ /g, '_');
                        // Use overrides, then fallback to mcasset.cloud item/block folders
                        let imgSrc = iconOverrides[i.name] || `https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/item/${formattedId}.png`;
                        let fallbackSrc = `https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/block/${formattedId}.png`;

                        catHtml += `<div class="item">
                            <img src="${imgSrc}" class="item-icon" onerror="this.onerror=null; this.src='${fallbackSrc}';">
                            <span class="item-name">${i.name}</span>
                            <span class="item-count">(${i.count})</span>
                            <span class="item-yield ${colorClass}">+${i.yield.toFixed(2)} pts</span>
                        </div>`;
                    });

                    if (index < group.length - 1 && sortedItems.length > 0) {
                        catHtml += `<div class="subgroup-gap"></div>`;
                    }
                });
                
                catHtml += `</div>`;
                html += catHtml;
            });

            document.getElementById('output').innerHTML = html;
        }
    </script>
